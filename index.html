<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela compartilhada</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f2f3f5; font: 15px system-ui, sans-serif; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; pointer-events: none; }
  #fs { position: fixed; right: 16px; bottom: 16px; padding: 8px 14px; border: 0; border-radius: 6px; background: #5865f2cc; color: #fff; font: inherit; cursor: pointer; display: none; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="status">Conectando...</div>
<button id="fs">Tela cheia</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
  const video = document.getElementById("video");
  const statusEl = document.getElementById("status");
  const fsBtn = document.getElementById("fs");
  const hostId = location.hash.slice(1);

  const show = (text) => { statusEl.textContent = text; statusEl.style.display = text ? "grid" : "none"; };

  if (!hostId) {
    show("Link inválido: falta o código depois do #.");
  } else {
    const peer = new Peer();
    peer.on("open", () => {
      const conn = peer.connect(hostId);
      conn.on("close", () => show("A transmissão terminou."));
    });
    peer.on("call", (call) => {
      call.answer();
      call.on("stream", (stream) => {
        video.srcObject = stream;
        video.play().catch(() => {});
        show("");
        fsBtn.style.display = "block";
      });
      call.on("close", () => show("A transmissão terminou."));
    });
    peer.on("error", (err) => {
      show(err.type === "peer-unavailable"
        ? "Essa transmissão não existe ou já terminou."
        : "Erro de conexão: " + err.type);
    });
  }
  fsBtn.addEventListener("click", () => document.documentElement.requestFullscreen());
</script>
</body>
</html>
